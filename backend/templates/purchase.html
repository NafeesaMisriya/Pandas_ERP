<!DOCTYPE html>
<html>
<head>
    <title>PANDAS – Purchase Entry</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="sec-bg">

<div class="navbar">
    <a href="/">🏠 Dashboard</a>
</div>

<img src="/static/images/logo.png" class="logo">

<header class="topbar">
    <h2>Purchase</h2>

    <div style="text-align:right; margin-bottom:10px;">
        <a href="/purchase/history" class="history-btn">
            📜 View Purchase History
        </a>
    </div>

</header>

<div class="purchase-container">


<form method="POST" action="/purchase/save">

<!-- SUPPLIER & DATE -->
<div style="display:flex; gap:20px; margin-bottom:20px;">
    <input type="text" name="supplier_name"  class="top-input"
           placeholder="Supplier / Shop Name"
           required style="flex:1;">

    <input type="date" name="purchase_date"  class="top-input"
           required style="width:200px;">
</div>

<!-- ITEMS TABLE -->
<table id="purchaseTable">
    <colgroup>
        <col><col><col><col><col><col>
    </colgroup>

<tr>
    <th>Category</th>
    <th>Item</th>
    <th>Qty</th>
    <th>Cost</th>
    <th>Total</th>
    <th></th>
</tr>

<tr>
    <td>
        <select name="category[]" onchange="loadItems(this)" required>
            <option value="">Select</option>
            {% for c in categories %}
            <option value="{{c}}">{{c}}</option>
            {% endfor %}
        </select>
    </td>

    <td>
        <select name="item_code[]" required>
            <option value="">Select Item</option>
        </select>

    </td>

    <td>
        <input type="number" step="0.25"
               name="quantity[]"
               oninput="calculateRow(this)"
               required>
    </td>

    <td>
        <input type="number" step="1.00"
               name="cost_price[]"
               oninput="calculateRow(this)"
               required>
    </td>

    <td>
        <input type="number" name="row_total[]"
               readonly>
    </td>

    <td>
        <button type="button" onclick="removeRow(this)">X</button>
    </td>
</tr>

</table>

<br>

<button type="button" onclick="addRow()">+ Add Item</button>

<hr>

<div class="total-section">
    <h3>Total: ₹<span id="grandTotal">0.00</span></h3>
</div>


<input type="hidden" name="grand_total" id="grandTotalInput">

<br>

<select name="bill_status" required>
    <option value="Paid">Paid</option>
    <option value="Unpaid">Unpaid</option>
</select>

<br><br>

<button class="checkout-btn">Save Purchase</button>

</form>
</div>

<script>

/* Add new row */
function addRow() {
    let table = document.getElementById("purchaseTable");
    let newRow = table.rows[1].cloneNode(true);

    newRow.querySelectorAll("input").forEach(i => i.value = "");

    newRow.querySelector("select[name='category[]']").value = "";
    newRow.querySelector("select[name='item_code[]']").innerHTML =
        '<option value="">Select Item</option>';

    table.appendChild(newRow);
}


/* Remove row */
function removeRow(btn) {
    let table = document.getElementById("purchaseTable");
    if (table.rows.length > 2) {
        btn.closest("tr").remove();
        calculateGrandTotal();
    }
}

/* Calculate row total */
function calculateRow(input) {
    let row = input.closest("tr");

    let qty = parseFloat(row.querySelector("input[name='quantity[]']").value) || 0;
    let cost = parseFloat(row.querySelector("input[name='cost_price[]']").value) || 0;

    let total = qty * cost;

    row.querySelector("input[name='row_total[]']").value =
        total.toFixed(2);

    calculateGrandTotal();
}

/* Calculate grand total */
function calculateGrandTotal() {
    let totals = document.querySelectorAll("input[name='row_total[]']");
    let sum = 0;

    totals.forEach(t => {
        sum += parseFloat(t.value) || 0;
    });

    document.getElementById("grandTotal").innerText =
        sum.toFixed(2);

    document.getElementById("grandTotalInput").value =
        sum.toFixed(2);
}

/* Load items based on category (AJAX) */
function loadItems(select) {
    let category = select.value;

    let row = select.closest("tr");
    let itemSelect = row.querySelector("select[name='item_code[]']");

    if (!category) {
        itemSelect.innerHTML =
            '<option value="">Select Item</option>';
        return;
    }

    fetch("/get-items/" + encodeURIComponent(category))
        .then(response => response.json())
        .then(data => {

            itemSelect.innerHTML =
                '<option value="">Select Item</option>';

            data.forEach(item => {
                let option = document.createElement("option");
                option.value = item[0];
                option.textContent = item[1];
                itemSelect.appendChild(option);
            });
        });
}


</script>

</body>
</html>
